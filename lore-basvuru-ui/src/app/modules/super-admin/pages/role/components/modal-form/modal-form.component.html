<!-- Modern Modal Header -->
<div class="modal-header bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-6 rounded-t-lg">
  <div class="flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-white/20 p-3 rounded-xl">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
      </div>
      <div>
        <h2 class="text-xl font-bold">{{ modalTitle }}</h2>
        <p class="text-emerald-100 text-sm mt-1">
          Sisteme {{ isEditMode ? 'rol düzenlemesi' : 'yeni rol tanımlaması' }} yapın
        </p>
      </div>
    </div>
    <button type="button" (click)="dialogRef.close()"
      class="text-white hover:bg-white/20 transition-colors duration-200 p-2 rounded">
      <i class="fas fa-times text-lg"></i>
    </button>
  </div>
</div>

<!-- Modern Modal Content -->
<div mat-dialog-content [formGroup]="formGroup" class="p-6 bg-white dark:bg-gray-900">

  <!-- Role Form -->
  <div class="space-y-6">

    <!-- Role Name Field -->
    <app-text-input [formGroup]="formGroup" controlName="name" label="Rol Adı" placeholder="Rol adını girin"
      icon="person" [isRequired]="true">
    </app-text-input>

    <!-- Form Preview Card -->
    <div
      class="bg-gradient-to-r from-emerald-50 to-teal-50 dark:from-gray-800 dark:to-gray-700 rounded-lg p-4 border border-emerald-200 dark:border-gray-600"
      *ngIf="formGroup.get('name')?.value">
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-100 dark:bg-emerald-900 p-2 rounded-full">
          <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
          </svg>
        </div>
        <div class="flex-1">
          <h3 class="font-semibold text-gray-900 dark:text-white">Rol Önizleme</h3>
          <div class="mt-2 space-y-1">
            <div class="flex items-center" *ngIf="formGroup.get('name')?.value">
              <span class="text-sm text-gray-600 dark:text-gray-400 w-20">Ad:</span>
              <span class="text-sm font-medium text-emerald-600 dark:text-emerald-300">{{ formGroup.get('name')?.value
                }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modern Modal Actions -->
<div mat-dialog-actions
  class="bg-gray-50 dark:bg-gray-800 px-6 py-4 rounded-b-lg border-t border-gray-200 dark:border-gray-700">
  <div class="flex items-center justify-between w-full">
    <div class="text-sm text-gray-500 dark:text-gray-400">
      <i class="fas fa-info-circle text-xs mr-1"></i>
      Rol bilgileri zorunludur
    </div>
    <div class="flex space-x-3">
      <app-action-button 
        label="İptal"
        icon="times"
        variant="secondary"
        [outline]="true"
        (onClick)="dialogRef.close()">
      </app-action-button>
      
      <app-action-button 
        [label]="isEditMode ? 'Rol Güncelle' : 'Rol Ekle'"
        icon="person"
        variant="primary"
        [loading]="roleService.isLoading$ | async"
        [loadingText]="isEditMode ? 'Güncelleniyor...' : 'Ekleniyor...'"
        [disabled]="formGroup.invalid"
        (onClick)="Save()">
      </app-action-button>
    </div>
  </div>
</div>
