<div mat-dialog-content [formGroup]="formGroup" class="p-6">
  <div class="mb-6">
    <h2 mat-dialog-title class="text-2xl font-semibold text-gray-900 dark:text-white">Update Page</h2>
  </div>

  <div class="space-y-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Enter page name" required>
      <mat-error *ngIf="formGroup.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Router Link</mat-label>
      <input matInput formControlName="routerLink" placeholder="Enter router link" required>
      <mat-error *ngIf="formGroup.get('routerLink')?.hasError('required')">
        Router Link is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Order No</mat-label>
      <input matInput formControlName="orderNo" placeholder="Enter order number" required>
      <mat-error *ngIf="formGroup.get('orderNo')?.hasError('required')">
        Order No is required
      </mat-error>
    </mat-form-field>
  </div>
</div>

<div mat-dialog-actions align="end" class="px-6 py-4 bg-gray-50 dark:bg-gray-800">
  <button mat-button (click)="dialogRef.close()" class="mr-2">
    <mat-icon>close</mat-icon>
    <span>İptal</span>
  </button>
  <button 
    mat-raised-button 
    color="primary" 
    (click)="Set()"
    [disabled]="formGroup.invalid || (pageService.isLoading$ | async)">
    <mat-icon>save</mat-icon>
    <span>Update Page</span>
  </button>
</div>
  <div class="modal-body text-center">
    <!-- </div> -->
    <div >

      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-bold mb-2">
          <span class="required">Name</span>
          <i class="fas fa-exclamation-circle ms-2 fs-7" data-bs-toggle="tooltip"
            title="Specify a target name for future usage and reference"></i>
        </label>
        <!--end::Label-->
        <input name="name" class="form-control form-control-lg form-control-solid" formControlName="name"
          placeholder="Name" autocomplete="off"
          [class.is-invalid]="formValidationService.isControlInvalid(formGroup,'name')"
          [class.is-valid]="formValidationService.isControlValid(formGroup,'name')" />
        <div class="d-flex invalid-feedback"
          *ngIf="formValidationService.controlHasError(formGroup,'required', 'name')">
          Name boş olamaz
        </div>
      </div>
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex fs-6 fw-bold mb-2">
          <span class="required">RouterLink</span>
          <i class="fas fa-exclamation-circle ms-2 fs-7" data-bs-toggle="tooltip"
            title="Specify a target name for future usage and reference"></i>
        </label>
        <!--end::Label-->
        <input name="routerLink" class="form-control form-control-lg form-control-solid" formControlName="routerLink"
          placeholder="routerLink" autocomplete="off"
          [class.is-invalid]="formValidationService.isControlInvalid(formGroup,'routerLink')"
          [class.is-valid]="formValidationService.isControlValid(formGroup,'routerLink')" />
