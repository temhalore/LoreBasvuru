<div mat-dialog-content [formGroup]="formGroup" class="p-6">
  <div class="mb-6">
    <h2 mat-dialog-title class="text-2xl font-semibold text-gray-900 dark:text-white">Kişi Güncelle</h2>
  </div>

  <div class="space-y-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Kişi Seçiniz</mat-label>
      <mat-select formControlName="userListDto" (selectionChange)="selectedUserId($event.value)" required>
        <mat-option *ngFor="let user of userListDto$ | async" [value]="user">
          {{user.nameSurname}}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="formGroup.get('userListDto')?.hasError('required')">
        Kişi seçimi zorunludur
      </mat-error>
    </mat-form-field>
  </div>
</div>

<div mat-dialog-actions align="end" class="px-6 py-4 bg-gray-50 dark:bg-gray-800">
  <button mat-button (click)="dialogRef.close()" class="mr-2">
    <mat-icon>close</mat-icon>
    <span>İptal</span>
  </button>
  <button 
    mat-raised-button 
    color="primary" 
    (click)="Set()"
    [disabled]="formGroup.invalid || (roleUserService.isLoading$ | async)">
    <mat-icon>save</mat-icon>
    <span>Güncelle</span>
  </button>
</div>
