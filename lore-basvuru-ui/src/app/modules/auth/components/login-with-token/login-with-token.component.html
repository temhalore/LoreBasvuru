<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
  <div class="max-w-md w-full space-y-8 p-8 text-center">

    <!-- Yukleniyor -->
    <div *ngIf="!hata && mesaj" class="flex flex-col items-center space-y-4">
      <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-indigo-600"></div>
      <p class="text-lg font-medium text-gray-600 dark:text-gray-300">{{ mesaj }}</p>
    </div>

    <!-- Hata durumu -->
    <div *ngIf="hata" class="flex flex-col items-center space-y-6">
      <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center">
        <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </div>
      <h3 class="text-2xl font-bold text-red-600 dark:text-red-400">Giris Basarisiz</h3>
      <p class="text-gray-600 dark:text-gray-400">{{ mesaj }}</p>
      <button (click)="goToLogin()"
        class="px-6 py-3 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors">
        Giris Sayfasina Git
      </button>
    </div>

  </div>
</div>
