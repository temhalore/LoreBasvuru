<div [formGroup]="nameOfFormGroup" >
  <!--begin::Label-->
  <label class="d-flex align-items-center fs-6 fw-bold mb-2">
    <span *ngIf="!isRequired">{{title}}</span>
    <span *ngIf="isRequired" class="required">{{title}}</span>
    <i *ngIf="hasToltip" class="fas fa-exclamation-circle ms-2 fs-7" data-bs-toggle="tooltip"
      title="{{tooltipTitle}}"></i>
  </label>
  <!--end::Label-->
  <!-- <input type="{{type}}" min="{{minValue}}" max="{{maxValue}}" name="{{controlName}}" class="{{customClass}}"
    formControlName="{{controlName}}" placeholder="{{placeHolder}}" autocomplete="off"
    [class.is-invalid]="formValidationService.isControlInvalid(nameOfFormGroup,controlName)"
    [class.is-valid]="formValidationService.isControlValid(nameOfFormGroup,controlName)" /> -->
  <textarea [froalaEditor]="options" name="{{controlName}}" class="{{customClass}}" formControlName="{{controlName}}"
    placeholder="{{placeHolder}}" autocomplete="off"
    [class.is-invalid]="formValidationService.isControlInvalid(nameOfFormGroup, controlName)"
    [class.is-valid]="formValidationService.isControlValid(nameOfFormGroup, controlName)">
</textarea>

  <!-- [(ngModel)]="mutabakatMetni"  -->

  <!-- <div class="d-flex invalid-feedback"
    *ngIf="formValidationService.controlHasError(nameOfFormGroup,'required', controlName)">
    {{title}} boş olamaz
  </div> -->
  <!-- {{formValidationService.getFormControlValidationErrors(this.nameOfFormGroup.controls, this.controlName)|json}} -->
  <div class="d-flex invalid-feedback" *ngIf="getFormControlValidationErrors('required')?.error_value">
    {{title}} boş olamaz
  </div>
  <div class="d-flex invalid-feedback" *ngIf="getFormControlValidationErrors('maxlength')">
    {{title}} {{getFormControlValidationErrors('maxlength')?.error_value.requiredLength|json}} karakterden uzun olamaz.
    Şuan {{getFormControlValidationErrors('maxlength')?.error_value.actualLength}} karakter girdiniz.
  </div>

  <div *ngIf="showHtmlPreview" class="mt-2">
    <label class="d-flex align-items-center fs-7 fw-semibold mb-1">HTML Çıktı</label>
    <pre class="p-2 border rounded" style="white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto;">{{ nameOfFormGroup.get(controlName)?.value || '' }}</pre>
  </div>
</div>
