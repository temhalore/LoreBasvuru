<!doctype html>
<html lang="tr">
    <head>
        <title>İstanbul Üniversitesi Mobil Admin</title>
        <meta charset="utf-8" />
        <meta
            name="description"
            content="İstanbul Üniversitesi Mobil Uygulama Yönetim Paneli"
        />
        <meta
            name="keywords"
            content="İstanbul Üniversitesi,Mobil Admin,Angular,Material,Admin Panel"
        />
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0"
        />

        <base href="/" />

        <!-- No cache meta tags -->
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="favicon/istanbul-university-favicon.svg" />
        <link rel="icon" type="image/svg+xml" sizes="32x32" href="favicon/istanbul-university-favicon-32x32.svg" />
        <link rel="icon" type="image/svg+xml" sizes="16x16" href="favicon/istanbul-university-favicon-16x16.svg" />
        <link rel="apple-touch-icon" href="favicon/istanbul-university-apple-touch-icon.svg" />

        <!-- Fonts -->
        <link href="https://fonts.gstatic.com" rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet"
        />

        <!-- FontAwesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

        <!-- Icon fonts -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />

        <!-- Froala Editor CSS -->
        <link href="https://cdn.jsdelivr.net/npm/froala-editor@latest/css/froala_editor.pkgd.min.css" rel="stylesheet" type="text/css" />
    </head>

    <body>
        <!-- Splash screen -->
        <fuse-splash-screen>
            <img src="images/logo/logo.svg" alt="Etik Kurul logo" />
            <div class="spinner">
                <div class="bounce1"></div>
                <div class="bounce2"></div>
                <div class="bounce3"></div>
            </div>
        </fuse-splash-screen>

        <!-- App root -->
        <app-root></app-root>

        <!-- Froala Editor JS -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/froala-editor@latest/js/froala_editor.pkgd.min.js"></script>
    </body>
</html>
